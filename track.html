<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متابعة الطلب - Pi Auto Market 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; padding: 20px; text-align: center; margin: 0; }
        .container { max-width: 500px; margin: 50px auto; padding: 30px; border: 1px solid #c5a059; border-radius: 20px; background: #1a1a1a; }
        h1 { color: #c5a059; }
        .status-box { background: #000; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #333; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #c5a059; background: #000; color: #fff; text-align: center; box-sizing: border-box; }
        .btn-check { background: #c5a059; color: #000; padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; width: 90%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>متابعة حالة الطلب</h1>
        <p>أدخل رقم الطلب المرسل إلى بريدك الإلكتروني لمعرفة الحالة:</p>
        <input type="text" placeholder="رقم الطلب (مثال: #123)">
        <button class="btn-check" onclick="alert('جاري التحقق من رقم الطلب... سيتم الرد عليك عبر البريد المسجل.');">استعلام</button>
        
        <div class="status-box">
            <p>حالة الطلب: <strong>بانتظار رقم الطلب</strong></p>
        </div>
        
        <br>
        <a href="index.html" style="color: #c5a059; text-decoration: none; font-weight: bold;">العودة للرئيسية</a>
    </div>
</body>
</html>
