<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    
    <!-- مكتبة Pi SDK -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    
    <!-- مكتبات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2Zxij5uvGBjGR4UJ216cREIWA4P1ex74",
            authDomain: "piautomarket2026.firebaseapp.com",
            projectId: "piautomarket2026",
            storageBucket: "piautomarket2026.appspot.com",
            messagingSenderId: "28607757565",
            appId: "1:28607757565:web:10b10ed14b5ba06a095294",
            measurementId: "G-PZJGYBV2NJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // وظيفة إضافة طلب لقاعدة البيانات
        window.saveOrderToFirebase = async (orderData) => {
            await addDoc(collection(db, "orders"), {
                ...orderData,
                timestamp: new Date()
            });
        };

        // وظيفة مراقبة الطلبات الحية
        window.listenForOrders = (callback) => {
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const orders = [];
                snapshot.forEach((doc) => orders.push(doc.data()));
                callback(orders);
            });
        };
    </script>

    <style>
        /* (احتفظت بنفس تنسيقاتك الأصلية كما هي) */
        :root { --gold: #c5a059; --dark-gold: #a37f3d; --white: #ffffff; --bg-card: #1a1a1a; --bg-dark: #000; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; padding-bottom: 40px; }
        .policy-banner { background: #e0b034; color: #000; font-weight: bold; padding: 8px; font-size: 13px; }
        .header { padding: 40px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 320px; margin: 0 auto; }
        h1 { color: var(--gold); }
        .form-section { background: var(--bg-card); padding: 30px; margin: 30px auto; width: 90%; max-width: 600px; border-radius: 20px; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; box-sizing: border-box; }
        .btn-action { background: var(--gold); color: black; padding: 14px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-test-payment { background: #e0b034 !important; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="policy-banner">⚠️ بيئة تجريبية فحص (Testnet Demo)</div>

    <div class="header">
        <img src="logo.png" class="logo" alt="Pi Auto Market 2026">
        <h1>منصة الوسيط الآمن</h1>
    </div>

    <div class="form-section">
        <button class="btn-action btn-test-payment" id="paymentBtn" onclick="runPiTestPayment()">إرسال 1 Test-Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034; font-weight: bold;"></p>
    </div>

    <div class="form-section">
        <h2 style="color: var(--gold);">تقديم طلب شراء 📝</h2>
        <form id="carOrderForm">
            <input type="text" id="piUsername" placeholder="اسم المستخدم Pi (@username)" required>
            <input type="text" id="carType" placeholder="نوع السيارة" required>
            <input type="text" id="carSpecs" placeholder="الموديل والمواصفات" required>
            <input type="text" id="carColor" placeholder="اللون">
            <button type="submit" class="btn-action">إرسال للوسيط الآمن</button>
        </form>
    </div>

    <div class="form-section">
        <h3 style="color: var(--gold);">سجل الطلبات الحية (من قاعدة البيانات)</h3>
        <div id="liveOrdersContainer" style="text-align: right;"></div>
    </div>

    <script>
    // ربط إرسال النموذج بـ Firebase
    document.getElementById('carOrderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const order = {
            username: document.getElementById('piUsername').value,
            car: document.getElementById('carType').value,
            specs: document.getElementById('carSpecs').value,
            color: document.getElementById('carColor').value
        };
        await window.saveOrderToFirebase(order);
        alert('تم إرسال طلبك للوسيط الآمن بنجاح!');
        this.reset();
    });

    // تحديث سجل الطلبات تلقائياً
    window.listenForOrders((orders) => {
        const container = document.getElementById('liveOrdersContainer');
        container.innerHTML = orders.map(o => `
            <div style="background:#222; padding:10px; margin:5px 0; border-right:3px solid var(--gold);">
                <strong>${o.username}</strong> طلب ${o.car} (${o.specs})
            </div>
        `).join('');
    });

    // كود الـ Pi SDK الخاص بك
    async function runPiTestPayment() {
        if (!window.Pi) return alert("يرجى استخدام Pi Browser");
        window.Pi.authenticate(['payments'], () => {}).then(auth => {
            window.Pi.createPayment({
                amount: 1.0, memo: "Pi Auto Market 2026 Test", metadata: {}
            }, {
                onReadyForServerApproval: (id) => alert("تم إنشاء الطلب: " + id),
                onReadyForServerCompletion: () => alert("تمت العملية بنجاح!"),
                onCancel: () => {}, onError: () => {}
            });
        });
    }
    </script>
</body>
</html>
