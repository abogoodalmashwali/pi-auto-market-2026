<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>مرحباً بك في سوق سيارات Pi</h1>
    <div id="status">جاري الاتصال بـ Pi...</div>

    <script>
        // إعداد Pi SDK فوراً
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        // محاولة المصادقة
        Pi.authenticate(['username'], function(auth) {
            document.getElementById('status').innerText = "تم الاتصال بنجاح! أهلاً بك: " + auth.user.username;
        }, function(error) {
            document.getElementById('status').innerText = "خطأ في الاتصال: " + error.message;
        });
    </script>
</body>
</html>
