<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>Pi Auto Market 2026</h1>
    <button id="authBtn">تسجيل الدخول بـ Pi</button>
    <button id="payBtn">ادفع 1 Pi للاستفسار</button>

    <script>
        // دالة بديلة للتأكد من تحميل الـ SDK
        const initPi = () => {
            if (window.Pi) {
                window.Pi.init({ version: "2.0", sandbox: false });
            }
        };
        initPi();

        document.getElementById('authBtn').onclick = async () => {
            try {
                const auth = await window.Pi.authenticate(['username'], {});
                alert("أهلاً بك: " + auth.user.username);
            } catch (e) { alert("خطأ في تسجيل الدخول"); }
        };

        document.getElementById('payBtn').onclick = async () => {
            try {
                window.Pi.createPayment({
                    amount: 1.0,
                    memo: "استفسار Pi Auto Market 2026",
                    recipient: "GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF"
                }, {
                    onSuccess: (p) => alert("تم الدفع بنجاح!"),
                    onCancel: (id) => alert("تم الإلغاء."),
                    onError: (err) => alert("خطأ: " + err.message)
                });
            } catch (e) { alert("يجب تسجيل الدخول أولاً أو تأكد من المتصفح"); }
        };
    </script>
</body>
</html>
