<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Auto Market 2026</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; text-align: center; }
    .header { background: #6a1b9a; color: white; padding: 20px; }
    .btn-action { display: block; width: 90%; margin: 10px auto; padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; color: white; }
    .btn-pay { background: #6a1b9a; }
    .btn-auth { background: #4a90e2; }
</style>
</head>
<body>

<div class="header">
    <h1>Pi Auto Market 2026</h1>
</div>

<div style="padding: 20px;">
    <button class="btn-action btn-auth" onclick="authenticateUser()">تسجيل الدخول بـ Pi</button>
    <button class="btn-action btn-pay" id="payButton">ادفع 1 Pi للاستفسار</button>
</div>

<script>
    const Pi = window.Pi;
    // تأكد من ضبط sandbox على false للتطبيق الحقيقي
    Pi.init({ version: "2.0", sandbox: false });

    async function authenticateUser() {
        try {
            const auth = await Pi.authenticate(['username'], {});
            alert("مرحباً بك يا " + auth.user.username);
        } catch (err) {
            alert("فشل تسجيل الدخول");
        }
    }

    // هذه هي الدالة المعدلة التي ستعمل في المتصفح الرسمي
    document.getElementById("payButton").onclick = function() {
        Pi.createPayment({
            amount: 1.0,
            memo: "استفسار Pi Auto Market 2026",
            recipient: "GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF"
        }, {
            onReadyForServerApproval: function(paymentId) { alert("جاهز للموافقة: " + paymentId); },
            onReadyForServerCompletion: function(paymentId, txid) { alert("تمت العملية بنجاح!"); },
            onCancel: function(paymentId) { alert("تم إلغاء الدفع."); },
            onError: function(error, payment) { alert("خطأ: " + error.message); }
        });
    };
</script>
</body>
</html>
