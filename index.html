<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        
        .header { padding: 40px 20px; background: #000; border-bottom: 4px solid var(--gold); }
        .logo { width: 350px; height: auto; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }
        
        h1 { font-size: 36px; color: var(--gold); margin-bottom: 10px; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 40px; padding: 40px; }
        .car-card { background: #1e1e1e; padding: 25px; border-radius: 25px; transition: transform 0.4s ease; border: 1px solid #333; }
        .car-card:hover { transform: scale(1.03); border-color: var(--gold); }
        .car-image { width: 100%; height: 300px; object-fit: cover; border-radius: 20px; }

        .form-section { background: #1a1a1a; padding: 50px; margin: 40px auto; width: 85%; border-radius: 25px; border: 2px solid var(--gold); }
        /* أضفت الـ IDs هنا لربطها بالبرمجة */
        input { width: 90%; padding: 20px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--gold); background: #2a2a2a; color: #fff; font-size: 18px; }
        
        .btn-action { background: var(--gold); color: black; padding: 20px 40px; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; font-size: 18px; margin: 10px; }
        
        .footer { padding: 40px; font-size: 16px; border-top: 2px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار منصة الوسيط الآمن">
        <h1>منصة الوسيط الآمن</h1>
        <p style="font-size: 20px;">أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="gallery">
        <div class="car-card"><h2>هيونداي النترا 2026</h2><img src="hyundai-elantra.png" class="car-image"></div>
        <div class="car-card"><h2>لكزس LX 2026</h2><img src="lexus-lx.png" class="car-image"></div>
        <div class="car-card"><h2>تويوتا كامري 2026</h2><img src="toyota-camry.png" class="car-image"></div>
        <div class="car-card"><h2>تويوتا هايلوكس 2026</h2><img src="toyota-hilux.png" class="car-image"></div>
    </div>

    <!-- بدأنا نموذج المحاكاة هنا -->
    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" id="custName" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" id="carType" placeholder="نوع السيارة المطلوبة">
        <input type="text" id="modelYear" placeholder="الموديل (مثلاً 2026)">
        <input type="text" id="color" placeholder="اللون المفضل">
        <input type="text" id="specs" placeholder="المواصفات المطلوبة">
        <br>
        <button class="btn-action" onclick="simulatePayment()">ادفع 10 Pi للاستفسار</button>
        <button class="btn-action" style="background: #fff;" onclick="submitDemoOrder()">تقديم الطلب</button>
    </div>

    <div class="footer">
        <a href="policy.html" style="color: var(--gold); font-size: 18px;">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

    <!-- كود JavaScript للمحاكاة -->
    <script>
        function submitDemoOrder() {
            const name = document.getElementById('custName').value;
            const car = document.getElementById('carType').value;
            
            if(name === "" || car === "") {
                alert("يرجى تعبئة الاسم ونوع السيارة على الأقل.");
            } else {
                console.log("طلب تجريبي مستلم:", { name, car });
                alert("تم استلام طلبك يا " + name + " بنجاح في النسخة التجريبية! (سيتم معالجة طلبك قريباً).");
            }
        }

        function simulatePayment() {
            alert("محاكاة: جاري الانتقال إلى بوابة دفع Pi Network...");
        }
    </script>
</body>
</html>
