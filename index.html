    <script>
        // دالة يتم استدعاؤها فور تحميل الصفحة
        window.addEventListener('load', () => {
            if (window.Pi) {
                window.Pi.init({ version: "2.0", sandbox: true });
                console.log("Pi SDK تم تهيئته");
            }
        });

        document.getElementById('payBtn').onclick = () => {
            if (!window.Pi) {
                alert("يجب فتح التطبيق داخل متصفح Pi");
                return;
            }
            window.Pi.createPayment({
                amount: 10.0,
                memo: "استفسار سيارة",
                recipient: "GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF"
            }, {
                onSuccess: (payment) => alert("تمت العملية بنجاح!"),
                onCancel: (paymentId) => alert("تم إلغاء الدفع"),
                onError: (error, payment) => alert("خطأ: " + error.message)
            });
        };
    </script>
