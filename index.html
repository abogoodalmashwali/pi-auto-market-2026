<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار التحديث</title>
    <style>
        body { text-align: center; padding: 50px; font-family: sans-serif; }
        #testBtn { padding: 20px; font-size: 20px; cursor: pointer; background-color: blue; color: white; border: none; }
    </style>
</head>
<body>

    <h1>صفحة الاختبار</h1>
    <p>إذا ظهرت هذه الصفحة، فالموقع يعمل والربط مع GitHub سليم!</p>
    
    <button id="testBtn" onclick="changeColor()">اضغط لتغيير اللون</button>

    <script>
        function changeColor() {
            document.getElementById('testBtn').style.backgroundColor = 'red';
            alert("تم التحديث بنجاح! الموقع يقرأ الكود الجديد.");
        }
    </script>
</body>
</html>
