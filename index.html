    <script>
        // دالة التأكد من وجود Pi SDK قبل العمل
        function initPi() {
            if (window.Pi) {
                window.Pi.init({ version: "2.0", sandbox: false });
                console.log("تم تحميل Pi SDK بنجاح");
            } else {
                console.error("لم يتم العثور على Pi SDK");
            }
        }

        // تشغيل التهيئة عند تحميل الصفحة
        window.addEventListener('load', initPi);

        const payButton = document.getElementById("payButton");
        
        payButton.addEventListener("click", async () => {
            // التحقق من وجود window.Pi قبل محاولة الدفع
            if (!window.Pi) {
                alert("خطأ: لم يتم تحميل مكتبة Pi. يرجى التأكد من فتح التطبيق عبر متصفح Pi.");
                return;
            }

            try {
                // محاولة الدفع
                window.Pi.createPayment({
                    amount: 10.0,
                    memo: "رسوم استفسار سيارة - Pi Auto Market",
                    recipient: "GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF"
                }, {
                    onSuccess: () => alert("تم الدفع بنجاح!"),
                    onCancel: () => alert("تم إلغاء الدفع"),
                    onError: (err) => alert("خطأ: " + err.message)
                });
            } catch (e) {
                alert("حدث خطأ تقني.");
                console.error(e);
            }
        });
    </script>
