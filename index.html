<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        h1 { color: var(--gold); margin-top: 10px; }
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; box-sizing: border-box; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); box-sizing: border-box; }
        input, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; box-sizing: border-box; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; width: 90%; }
        .btn-test-payment { background: #e0b034 !important; color: #000 !important; font-size: 18px; box-shadow: 0 0 15px #e0b034; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .footer { padding: 30px; border-top: 2px solid #333; margin-top: 20px; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="form-section" style="border: 2px solid #e0b034; padding: 35px 20px;">
        <button class="btn-action btn-test-payment" onclick="runPiTestPayment()">إرسال 1 Test-Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034; font-weight: bold; margin-top: 15px; font-size: 15px;"></p>
    </div>

    <div class="gallery-container">
        <div class="car-box"><img src="toyota-camry.png" alt="كامري"><h3>تويوتا كامري 2026</h3></div>
        <div class="car-box"><img src="lexus-lx.png" alt="لكزس"><h3>لكزس LX 2026</h3></div>
    </div>

    <div class="form-section">
        <h3 style="color: var(--gold);">هل تملك سيارة وتريد عرضها للبيع؟</h3>
        <button class="btn-action" onclick="document.getElementById('sellerModal').style.display='flex'" style="background:transparent; color:var(--gold); border: 1px solid var(--gold);">عرض سيارتي للبيع</button>
    </div>

    <div id="sellerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; padding: 20px; box-sizing: border-box;">
        <div style="background:#1a1a1a; padding:30px; border-radius:20px; width:90%; max-width: 500px; border:1px solid #c5a059; margin: 50px auto;">
            <h2 style="color:#c5a059;">بيانات السيارة المعروضة</h2>
            <input type="text" placeholder="اسم البائع الكامل">
            <input type="text" placeholder="نوع وموديل السيارة">
            <button class="btn-action" style="width:100%" onclick="alert('تم الاستلام'); document.getElementById('sellerModal').style.display='none';">إرسال الطلب</button>
        </div>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
    </div>

    <script>
        const API_URL = '/api/approve';
        try { if (window.Pi) { window.Pi.init({ version: "2.0", sandbox: true }); } } catch (e) { console.error(e); }

        function updateStatus(text) { document.getElementById('statusMessage').innerText = text; }

        async function runPiTestPayment() {
            if (!window.Pi) { alert("يجب فتح الرابط من داخل تطبيق Pi Browser!"); return; }
            updateStatus("جاري المصادقة...");
            try {
                window.Pi.authenticate(['username', 'payments'], onIncompletePaymentFound)
                .then(() => executePaymentProcess())
                .catch(err => updateStatus("خطأ: " + err.message));
            } catch (err) { alert("خطأ: " + err.message); }
        }

        function executePaymentProcess() {
            window.Pi.createPayment({ amount: 1, memo: "Auto Market 2026", metadata: { type: "verification" } }, {
                onReadyForServerApproval: function(paymentId) {
                    updateStatus("جاري التواصل مع الخادم...");
                    fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paymentId }) })
                    .then(res => res.json()).then(data => updateStatus("تمت الموافقة من الخادم!")).catch(err => updateStatus("خطأ خادم"));
                },
                onReadyForServerCompletion: function(id, tx) { updateStatus("نجحت المعاملة!"); },
                onCancel: function(id) { updateStatus("تم الإلغاء."); },
                onError: function(err, pay) { updateStatus("خطأ: " + err.message); }
            });
        }

        function onIncompletePaymentFound(payment) {
            updateStatus("معاملة عالقة، جاري المعالجة...");
            fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ paymentId: payment.identifier }) })
            .then(res => res.json()).then(data => updateStatus("تم تنظيف المعاملة العالقة!")).catch(err => updateStatus("خطأ تنظيف"));
        }
    </script>
</body>
</html>
