<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fa; text-align: center; color: #333; margin: 0; }
        header { background-color: #28a745; color: white; padding: 25px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .car { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .pi-pay-btn { background-color: #28a745; color: white; padding: 12px; border-radius: 8px; border: none; width: 100%; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #user-info { color: #ffffff; font-weight: bold; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>
<header>
    <h1>Pi Auto Market 2026</h1>
    <div id="user-info">جاري التحقق من الاتصال بشبكة Pi...</div>
</header>

<div class="gallery">
    <div class="car"><h3>Lexus LX 2026</h3><button class="pi-pay-btn" onclick="createPayment('Lexus LX 2026')">ادفع 1 Pi</button></div>
    <div class="car"><h3>Toyota Camry 2026</h3><button class="pi-pay-btn" onclick="createPayment('Toyota Camry 2026')">ادفع 1 Pi</button></div>
</div>

<script>
    // 1. التهيئة (تأكد من عدم وجود أخطاء في الـ App ID إذا وضعته لاحقاً)
    Pi.init({ version: "2.0", sandbox: true });

    // 2. دالة المصادقة المحسنة
    async function init() {
        try {
            Pi.authenticate(['username', 'payments'], function(auth) {
                document.getElementById('user-info').innerText = "مرحباً بك: " + auth.user.username;
            }, function(error) {
                document.getElementById('user-info').innerText = "خطأ في المصادقة: " + error;
            });
        } catch (e) {
            document.getElementById('user-info').innerText = "يجب فتح التطبيق داخل Pi Browser";
        }
    }
    
    window.onload = init;

    // 3. دالة الدفع مع معالجة دقيقة للـ Server Completion
    async function createPayment(carName) {
        Pi.createPayment({
            amount: 1,
            memo: "شراء سيارة: " + carName,
            metadata: { car: carName },
        }, {
            onReadyForServerApproval: (paymentId) => {
                alert("تم إنشاء طلب الدفع، جاري تحويلك للمحفظة لتأكيد العملية...");
            },
            onReadyForServerCompletion: (paymentId, txid) => {
                alert("تهانينا! تمت العملية بنجاح. رقم المعاملة: " + txid);
                // هنا سيتم تحديث حالة المهمة 10 في لوحة المطورين
            },
            onCancel: () => alert("تم إلغاء العملية من قبلك."),
            onError: (err) => alert("حدث خطأ تقني: " + err.message)
        });
    }
</script>
</body>
</html>
