<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        h1 { color: var(--gold); margin-top: 10px; }
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); }
        input, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; font-weight: bold; width: 90%; cursor: pointer; }
        .footer { padding: 30px; border-top: 2px solid #333; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="form-section" style="border: 2px solid #e0b034;">
        <button class="btn-action" onclick="runPiTestPayment()">إرسال 1 Test-Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034; margin-top: 15px;"></p>
    </div>

    <div class="gallery-container">
        <div class="car-box"><img src="toyota-camry.png" alt="كامري"><h3>تويوتا كامري 2026</h3></div>
        <div class="car-box"><img src="lexus-lx.png" alt="لكزس"><h3>لكزس LX 2026</h3></div>
    </div>

    <div class="form-section">
        <h3>هل تملك سيارة وتريد عرضها للبيع؟</h3>
        <button class="btn-action" onclick="document.getElementById('sellerModal').style.display='flex'">عرض سيارتي للبيع</button>
    </div>

    <div id="sellerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; padding:20px;">
        <div style="background:#1a1a1a; padding:30px; border-radius:20px; max-width:500px; margin:50px auto; border:1px solid #c5a059;">
            <h2>بيانات السيارة</h2>
            <input type="text" placeholder="اسم البائع">
            <input type="text" placeholder="نوع السيارة">
            <button class="btn-action" onclick="document.getElementById('sellerModal').style.display='none'">إرسال</button>
        </div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء</h2>
        <form><input type="text" placeholder="الاسم الكامل" required><button type="submit" class="btn-action">إرسال</button></form>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
    </div>

    <script>
        window.Pi.init({ version: "2.0", sandbox: true });
        function updateStatus(text) { document.getElementById('statusMessage').innerText = text; }

        async function runPiTestPayment() {
            updateStatus("جاري المصادقة...");
            window.Pi.authenticate(['username', 'payments'], onIncompletePaymentFound).then(() => {
                window.Pi.createPayment({ amount: 1, memo: "فحص", metadata: { type: "verification" } }, {
                    onReadyForServerApproval: (pid) => updateStatus("جاري المعالجة..."),
                    onReadyForServerCompletion: (pid, txid) => updateStatus("نجاح! تمت العملية."),
                    onCancel: (pid) => updateStatus("تم الإلغاء."),
                    onError: (err) => updateStatus("خطأ: " + err.message)
                });
            }).catch(e => updateStatus("فشل: " + e.message));
        }

        function onIncompletePaymentFound(payment) {
            updateStatus("جاري معالجة معاملة معلقة...");
            window.Pi.approvePayment(payment.identifier, () => {
                updateStatus("تم التنظيف! أعد فتح الصفحة.");
                setTimeout(() => location.reload(), 2000);
            });
        }
    </script>
</body>
</html>
