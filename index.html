<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
    // تغيير جذري: استخدام حدث "DOMContentLoaded" لضمان تحميل كل شيء
    document.addEventListener("DOMContentLoaded", function() {
        console.log("جاري محاولة الاتصال بـ Pi SDK...");
        
        // تأكد من وجود Pi قبل الاستخدام
        if (typeof Pi !== 'undefined') {
            Pi.init({ version: "2.0", sandbox: true });

            Pi.authenticate(['username', 'payments'], function(auth) {
                document.getElementById('user-info').innerText = "مرحباً بك: " + auth.user.username;
            }, function(error) {
                document.getElementById('user-info').innerText = "خطأ في الاتصال: " + error;
            });
        } else {
            document.getElementById('user-info').innerText = "فشل تحميل Pi SDK، يرجى إعادة تحديث الصفحة.";
        }
    });

    async function createPayment(carName) {
        // تأكد من أن الدالة لا تعمل إلا إذا كان Pi محملاً
        if (typeof Pi === 'undefined') {
            alert("يرجى الانتظار حتى يكتمل الاتصال...");
            return;
        }
        
        Pi.createPayment({
            amount: 1,
            memo: "شراء سيارة: " + carName,
            metadata: { car: carName },
        }, {
            onReadyForServerApproval: (paymentId) => {
                alert("تم إنشاء طلب الدفع، جاري تحويلك للمحفظة...");
            },
            onReadyForServerCompletion: (paymentId, txid) => {
                alert("تمت العملية بنجاح! رقم المعاملة: " + txid);
            },
            onCancel: () => alert("تم إلغاء العملية."),
            onError: (err) => alert("خطأ في الدفع: " + err.message)
        });
    }
</script>
