<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026 | المنصة الرائدة</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --gold: #c5a059; --dark: #1a1a1a; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; background: linear-gradient(to bottom, #2c2c2c, #1a1a1a); border-bottom: 3px solid var(--gold); }
        .logo { width: 120px; margin-bottom: 15px; border-radius: 50%; }
        .welcome-text { font-size: 22px; color: var(--gold); margin: 10px 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .car-card { background: #252525; padding: 15px; border-radius: 15px; border: 1px solid #333; }
        .car-image { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; }
        .btn-pay { background: var(--gold); color: black; padding: 15px 30px; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; font-size: 16px; margin: 20px 0; }
        .footer { padding: 30px; font-size: 14px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المنصة">
        <h1 class="welcome-text">مرحباً بكم في منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية تسهل لكم التعامل مع الشركات والوكالات التي تقبل التعامل بعملة Pi</p>
        <p style="font-style: italic; opacity: 0.8;">تحت إشراف: أبو جود المشولي</p>
    </div>

    <div class="gallery">
        <div class="car-card"><h3>هيونداي النترا 2026</h3><img src="hyundai-elantra.png" class="car-image"></div>
        <div class="car-card"><h3>لكزس LX 2026</h3><img src="lexus-lx.png" class="car-image"></div>
        <div class="car-card"><h3>تويوتا كامري 2026</h3><img src="toyota-camry.png" class="car-image"></div>
        <div class="car-card"><h3>تويوتا هايلوكس 2026</h3><img src="toyota-hilux.png" class="car-image"></div>
    </div>

    <button class="btn-pay" onclick="alert('جاري ربط محفظة Pi...')">احجز استشارتك (10 Pi)</button>

    <div class="footer">
        <a href="policy.html" style="color: var(--gold); text-decoration: none;">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
