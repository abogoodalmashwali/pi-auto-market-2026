<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        
        .header { padding: 40px 20px; background: #000; border-bottom: 4px solid var(--gold); }
        .logo { width: 350px; height: auto; margin-bottom: 25px; display: block; margin-left: auto; margin-right: auto; }
        h1 { font-size: 36px; color: var(--gold); margin-bottom: 10px; }
        
        /* تصميم المعرض الجديد: سيارتين بجانب بعض */
        .gallery-two-cars { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
        
        .car-card-side { 
            background: rgba(30, 30, 30, 0.6); 
            backdrop-filter: blur(10px); 
            padding: 20px; 
            border-radius: 20px; 
            width: 350px; 
            border: 1px solid rgba(197, 160, 89, 0.3);
            transition: all 0.4s ease;
        }
        .car-card-side:hover { transform: translateY(-10px); border-color: var(--gold); background: rgba(40, 40, 40, 0.8); }
        .car-image { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; }

        .form-section { background: rgba(26, 26, 26, 0.7); backdrop-filter: blur(5px); padding: 50px; margin: 40px auto; width: 85%; border-radius: 25px; border: 1px solid var(--gold); }
        input { width: 90%; padding: 20px; margin: 15px 0; border-radius: 12px; border: 1px solid var(--gold); background: #2a2a2a; color: #fff; font-size: 18px; }
        
        .btn-action { background: var(--gold); color: black; padding: 20px 40px; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; font-size: 18px; margin: 10px; transition: 0.3s; }
        .btn-action:hover { opacity: 0.8; transform: scale(1.05); }
        
        .footer { padding: 50px 20px; border-top: 2px solid #333; }
        .footer a { color: var(--gold); font-size: 24px; font-weight: bold; display: block; margin: 20px 0; text-decoration: none; }
        .footer p { font-size: 18px; margin-top: 30px; color: #888; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار منصة الوسيط الآمن">
        <h1>منصة الوسيط الآمن</h1>
        <p style="font-size: 20px;">أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <!-- المعرض المحدث -->
    <div class="gallery-two-cars">
        <div class="car-card-side">
            <img src="lexus-lx.png" class="car-image">
            <h2>لكزس LX 2026</h2>
        </div>
        <div class="car-card-side">
            <img src="toyota-camry.png" class="car-image">
            <h2>تويوتا كامري 2026</h2>
        </div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" id="custName" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" id="carType" placeholder="نوع السيارة المطلوبة">
        <input type="text" id="modelYear" placeholder="الموديل (مثلاً 2026)">
        <input type="text" id="color" placeholder="اللون المفضل">
        <input type="text" id="specs" placeholder="المواصفات المطلوبة">
        <br>
        <button class="btn-action" onclick="simulatePayment()">ادفع 10 Pi للاستفسار</button>
        <button class="btn-action" style="background: #fff;" onclick="submitDemoOrder()">تقديم الطلب</button>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

    <script>
        function submitDemoOrder() {
            const name = document.getElementById('custName').value;
            const car = document.getElementById('carType').value;
            if(name === "" || car === "") {
                alert("يرجى تعبئة الاسم ونوع السيارة على الأقل.");
            } else {
                const orderID = "PI-" + Math.floor(1000 + Math.random() * 9000);
                alert("تم استلام طلبك يا " + name + " بنجاح!\nرقم طلبك هو: " + orderID);
            }
        }
        function simulatePayment() {
            alert("محاكاة: جاري الانتقال إلى بوابة دفع Pi Network...");
        }
    </script>
</body>
</html>
