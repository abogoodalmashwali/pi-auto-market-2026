<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <h1>Pi Auto Market 2026</h1>
    <button id="payButton" style="padding: 20px; font-size: 20px; background: #6a1b9a; color: white; border: none; border-radius: 10px;">ادفع 1 Pi للاستفسار</button>

    <script>
        // تهيئة الـ SDK
        Pi.init({ version: "2.0" });

        document.getElementById('payButton').addEventListener('click', function() {
            // محاولة استخدام الـ SDK المباشر
            try {
                Pi.createPayment({
                    amount: 1.0,
                    memo: "استفسار Pi Auto Market",
                    recipient: "GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF"
                }, {
                    onSuccess: function(payment) { alert("تم الدفع بنجاح!"); },
                    onCancel: function() { alert("تم إلغاء الدفع."); },
                    onError: function(err) { alert("خطأ: " + err); }
                });
            } catch (e) {
                // إذا فشل الـ SDK، نستخدم الرابط المباشر كحل بديل داخل متصفح Pi
                window.location.href = "pi://pay?amount=1&memo=PiAutoMarket2026&recipient=GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF";
            }
        });
    </script>
</body>
</html>
