<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Auto Market 2026</title>
<style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
    .header { background: #6a1b9a; color: white; padding: 15px; text-align: center; }
    .logo { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 15px; }
    .card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
    .footer { background: #ffffff; padding: 15px; border-top: 2px solid #6a1b9a; position: sticky; bottom: 0; text-align: center; }
    .btn-pay { display: block; width: 100%; background: #6a1b9a; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
    <img src="logo.png" alt="Logo" class="logo">
    <h1>Pi Auto Market 2026</h1>
</div>

<div class="grid">
    <div class="card"><img src="images/lexus-lx.png" alt="Lexus"><h3>Lexus LX</h3></div>
    <div class="card"><img src="images/toyota-camry.png" alt="Camry"><h3>Toyota Camry</h3></div>
    <div class="card"><img src="images/toyota-hilux.png" alt="Hilux"><h3>Toyota Hilux</h3></div>
    <div class="card"><img src="images/hyundai-elantra.png" alt="Elantra"><h3>Hyundai Elantra</h3></div>
</div>

<div class="footer">
    <button class="btn-pay" onclick="window.location.href='pi://pay?amount=1&memo=PiAutoMarket2026&address=GBBSWDK3LGGRVQFIWFH3BDQYWTZ0Y7Z7EJHJDUXXV3QKTRGEOJ50KWF'">ادفع 1 Pi للاستفسار</button>
    <div style="margin-top: 10px;">
        <a href="policy.html" style="color: #6a1b9a; font-size: 0.8em;">سياسة الخصوصية وإخلاء المسؤولية</a>
    </div>
</div>

</body>
</html>
