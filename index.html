<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        h1 { color: var(--gold); margin-top: 10px; }
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; box-sizing: border-box; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); }
        input, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; width: 90%; }
        .btn-test-payment { background: #e0b034 !important; color: #000 !important; font-size: 18px; box-shadow: 0 0 15px #e0b034; }
        .footer { padding: 30px; border-top: 2px solid #333; margin-top: 20px; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="form-section" style="border: 2px solid #e0b034;">
        <button id="payButton" class="btn-action btn-test-payment">إرسال 1 Test-Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034; font-weight: bold; margin-top: 15px;"></p>
    </div>

    <div style="background: #1a1a1a; padding: 20px; border-radius: 15px; margin: 20px auto; width: 90%; max-width: 500px; border: 1px solid #c5a059;">
        <p>نرحب بك في مستقبل تداول السيارات! في 'Pi Auto Market 2026'، نجمع بين جودة السيارات وقوة عملة Pi.</p>
    </div>

    <div class="gallery-container">
        <div class="car-box"><h3>تويوتا كامري 2026</h3></div>
        <div class="car-box"><h3>لكزس LX 2026</h3></div>
    </div>

    <div class="form-section">
        <button class="btn-action" style="background:transparent; color:var(--gold); border: 1px solid var(--gold);" onclick="document.getElementById('sellerModal').style.display='flex'">عرض سيارتي للبيع</button>
    </div>

    <div id="sellerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; padding: 20px;">
        <div style="background:#1a1a1a; padding:20px; border-radius:20px; margin: 50px auto; border:1px solid #c5a059;">
            <h2 style="color:#c5a059;">بيانات السيارة</h2>
            <button class="btn-action" onclick="document.getElementById('sellerModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية</a>
    </div>

    <script>
        document.getElementById('payButton').addEventListener('click', function() {
            if (!window.Pi) { alert("افتح من Pi Browser!"); return; }
            window.Pi.init({ version: "2.0", sandbox: true });
            window.Pi.authenticate(['payments'], function(err) {}).then(function() {
                window.Pi.createPayment({ amount: 1, memo: "Test", metadata: { type: "test" } }, {
                    onReadyForServerApproval: function(id) { document.getElementById('statusMessage').innerText = "جاري التأكيد..."; },
                    onReadyForServerCompletion: function(id, tx) { alert("اكتملت!"); },
                    onError: function(e) { document.getElementById('statusMessage').innerText = "خطأ: " + e.message; }
                });
            });
        });
    </script>
</body>
</html>
