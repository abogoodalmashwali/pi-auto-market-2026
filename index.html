<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); }
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; width: 90%; }
        .footer { padding: 30px; border-top: 2px solid #333; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار">
        <h1>منصة الوسيط الآمن</h1>
    </div>

    <!-- قسم الدفع -->
    <div class="form-section" style="border: 2px solid #e0b034;">
        <button class="btn-action" style="background:#e0b034" onclick="runPiTestPayment()">إرسال 1 Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034;"></p>
    </div>

    <!-- قسم عرض السيارات -->
    <div class="gallery-container">
        <div class="car-box"><img src="toyota-camry.png" alt="كامري"><h3>تويوتا كامري 2026</h3></div>
        <div class="car-box"><img src="lexus-lx.png" alt="لكزس"><h3>لكزس LX 2026</h3></div>
    </div>

    <!-- هل تمتلك سيارة للبيع؟ -->
    <div class="form-section">
        <h3>هل تملك سيارة وتريد عرضها للبيع؟</h3>
        <form action="https://formspree.io/f/meewgjzw" method="POST">
            <input type="text" name="الاسم" placeholder="اسمك الكامل" required>
            <input type="text" name="نوع_السيارة" placeholder="نوع وموديل السيارة" required>
            <button type="submit" class="btn-action" style="background:transparent; color:var(--gold); border:1px solid var(--gold);">عرض سيارتي للبيع</button>
        </form>
    </div>

    <!-- طلب شراء -->
    <div class="form-section">
        <h2>تقديم طلب شراء / استفسار 📝</h2>
        <form action="https://formspree.io/f/meewgjzw" method="POST">
            <input type="text" name="الاسم" placeholder="اسم مقدم الطلب" required>
            <input type="text" name="السيارة" placeholder="نوع السيارة المطلوبة" required>
            <button type="submit" class="btn-action">إرسال الطلب للوسيط</button>
        </form>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية</a>
    </div>

    <script>
        const SERVER_URL = "https://pi-auto-market-2026.vercel.app";
        try { window.Pi.init({ version: "2.0", sandbox: true }); } catch (e) {}

        function updateStatus(text) { document.getElementById('statusMessage').innerText = text; }

        async function runPiTestPayment() {
            window.Pi.authenticate(['payments'], function(auth) {
                window.Pi.createPayment({amount: 1, memo: "Pi Auto Market Payment"}, {
                    serverURL: SERVER_URL,
                    onReadyForServerApproval: function(id) {
                        fetch(`/api/approve`, { method: "POST", body: JSON.stringify({ paymentId: id }) });
                        updateStatus("تم إرسال الطلب للمعالجة");
                    },
                    onReadyForServerCompletion: function(id, txid) { updateStatus("نجاح العملية!"); }
                });
            });
        }
    </script>
</body>
</html>
