<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <!-- استيراد مكتبة Pi Network -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; text-align: center; }
        .header { background: #6a1b9a; color: white; padding: 20px; }
        .logo { width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; }
        .btn-pay { background: #6a1b9a; color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 18px; cursor: pointer; width: 90%; margin-top: 20px; }
        .policy { margin-top: 20px; color: #6a1b9a; text-decoration: underline; font-size: 14px; display: block; }
    </style>
</head>
<body>

<div class="header">
    <img src="logo.png" class="logo" alt="شعار المشروع">
    <h1>Pi Auto Market 2026</h1>
</div>

<div class="grid">
    <div class="card"><img src="images/toyota-camry.png" alt="Camry"><h3>Toyota Camry</h3></div>
    <div class="card"><img src="images/lexus-lx.png" alt="Lexus"><h3>Lexus LX</h3></div>
    <div class="card"><img src="images/hyundai-elantra.png" alt="Elantra"><h3>Hyundai Elantra</h3></div>
    <div class="card"><img src="images/toyota-hilux.png" alt="Hilux"><h3>Toyota Hilux</h3></div>
</div>

<button class="btn-pay" onclick="payWithPi()">ادفع 1 Pi للاستفسار</button>

<a href="policy.html" class="policy">سياسة الخصوصية وإخلاء المسؤولية</a>

<script>
    // ضع مفتاحك هنا داخل علامتي التنصيص
    const PI_API_KEY = "yeugvacpplk7npt32k8ipvq1qwmwehx9fh7vetp6oqpfoqdvlki0gikdfljqwnhw"; 

    function payWithPi() {
        Pi.createPayment({
            amount: 1,
            memo: "PiAutoMarket2026",
            metadata: { type: "inquiry" }
        }, {
            onReadyForServerApproval: (paymentId) => {
                console.log("تم إنشاء الطلب:", paymentId);
            },
            onReadyForServerCompletion: (paymentId, txid) => {
                alert("تمت العملية بنجاح! رقم المعاملة: " + txid);
            },
            onCancel: () => alert("تم إلغاء الدفع"),
            onError: (error) => alert("حدث خطأ: " + error)
        });
    }
</script>

</body>
</html>
