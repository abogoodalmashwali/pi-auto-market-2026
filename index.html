<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --white: #ffffff; --pi-purple: #541982; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        h1 { color: var(--gold); margin-top: 10px; }
        
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .car-box h3 { font-size: 16px; margin-top: 10px; }

        .pi-pay-button { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1d1d1d 0%, #1a1a1a 100%); color: #fff; border: 2px solid var(--pi-purple); padding: 10px; border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .pi-icon { width: 25px; margin-left: 10px; }

        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); }
        input, select { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; width: 90%; }
        
        .footer { padding: 30px; border-top: 2px solid #333; margin-top: 20px; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="gallery-container">
        <div class="car-box">
            <img src="toyota-camry.png" alt="كامري">
            <h3>تويوتا كامري 2026</h3>
            <button class="pi-pay-button" onclick="alert('جاري التوجيه للدفع عبر Pi...')">
                <img src="https://minepi.com/wp-content/uploads/2021/11/pi-logo-300x300.png" class="pi-icon">
                <span>1500 Pi</span>
            </button>
        </div>
        <div class="car-box">
            <img src="lexus-lx.png" alt="لكزس">
            <h3>لكزس LX 2026</h3>
            <button class="pi-pay-button" onclick="alert('جاري التوجيه للدفع عبر Pi...')">
                <img src="https://minepi.com/wp-content/uploads/2021/11/pi-logo-300x300.png" class="pi-icon">
                <span>2500 Pi</span>
            </button>
        </div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء 📝</h2>
        <form action="https://formspree.io/f/meewgjzw" method="POST">
            <input type="text" name="الاسم" placeholder="الاسم الكامل" required>
            <input type="text" name="السيارة" placeholder="نوع السيارة" required>
            <button type="submit" class="btn-action">إرسال الطلب</button>
        </form>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p style="color: #666; font-size: 14px;">© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
