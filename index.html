<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fa; text-align: center; color: #333; }
        header { background-color: #28a745; color: white; padding: 25px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; }
        .car { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .pi-pay-btn { background-color: #28a745; color: white; padding: 12px; border-radius: 8px; border: none; width: 100%; cursor: pointer; margin-top: 10px; }
        #user-info { color: #ffffff; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
<header>
    <h1>Pi Auto Market 2026</h1>
    <div id="user-info">جاري التحقق من الاتصال بشبكة Pi...</div>
</header>

<div class="gallery">
    <div class="car"><h3>Lexus LX 2026</h3><button class="pi-pay-btn" onclick="createPayment('Lexus LX 2026')">ادفع 1 Pi</button></div>
    <div class="car"><h3>Toyota Camry 2026</h3><button class="pi-pay-btn" onclick="createPayment('Toyota Camry 2026')">ادفع 1 Pi</button></div>
</div>

<script>
    // تهيئة الـ SDK مع التأكد من إعدادات الـ sandbox
    Pi.init({ version: "2.0", sandbox: true });

    async function init() {
        try {
            // المصادقة مع طلب صلاحية الدفع
            const auth = await Pi.authenticate(['username', 'payments'], (user) => {
                document.getElementById('user-info').innerText = "مرحباً بك: " + user.username;
            }, (error) => {
                alert("فشل المصادقة: " + error);
            });
        } catch (e) {
            console.error("خطأ:", e);
            document.getElementById('user-info').innerText = "يجب فتح التطبيق داخل Pi Browser";
        }
    }
    
    // تشغيل المصادقة عند تحميل الصفحة
    window.onload = init;

    async function createPayment(carName) {
        try {
            Pi.createPayment({
                amount: 1,
                memo: "شراء سيارة: " + carName,
                metadata: { car: carName },
            }, {
                onReadyForServerApproval: (paymentId) => {
                    alert("تم إنشاء طلب الدفع، جاري تحويلك للمحفظة...");
                },
                onReadyForServerCompletion: (paymentId, txid) => {
                    alert("تمت العملية بنجاح! رقم المعاملة: " + txid);
                },
                onCancel: () => alert("تم إلغاء العملية."),
                onError: (err) => alert("خطأ في الدفع: " + err.message)
            });
        } catch (e) {
            alert("حدث خطأ في طلب الدفع: " + e.message);
        }
    }
</script>
</body>
</html>
