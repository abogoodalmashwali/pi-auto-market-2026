<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
        h1 { color: var(--gold); margin-top: 10px; }

        /* تنسيق الصور بجانب بعض */
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .car-box h3 { font-size: 16px; margin-top: 10px; }

        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; border-radius: 20px; border: 1px solid var(--gold); }
        input { width: 90%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; box-sizing: border-box; }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; }
        
        /* تنسيق الفوتر */
        .footer { padding: 30px; border-top: 2px solid #333; margin-top: 20px; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <!-- عرض الصور بجانب بعض -->
    <div class="gallery-container">
        <div class="car-box">
            <img src="toyota-camry.png" alt="كامري">
            <h3>تويوتا كامري 2026</h3>
        </div>
        <div class="car-box">
            <img src="lexus-lx.png" alt="لكزس">
            <h3>لكزس LX 2026</h3>
        </div>
    </div>

    <!-- زر فتح نموذج البائع -->
    <div class="form-section">
        <h3 style="color: var(--gold);">هل تملك سيارة وتريد عرضها للبيع؟</h3>
        <button class="btn-action" onclick="document.getElementById('sellerModal').style.display='flex'" style="background:transparent; color:var(--gold); border: 1px solid var(--gold);">عرض سيارتي للبيع</button>
    </div>

    <!-- نموذج البائع المنبثق -->
    <div id="sellerModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#1a1a1a; padding:30px; border-radius:20px; width:85%; border:1px solid #c5a059;">
            <h2 style="color:#c5a059;">بيانات السيارة المعروضة</h2>
            <input type="text" id="sellerName" placeholder="اسم البائع الكامل">
            <input type="text" id="carDetails" placeholder="نوع وموديل السيارة">
            <input type="text" id="pricePi" placeholder="السعر المطلوب بعملة Pi">
            <br>
            <button class="btn-action" onclick="alert('تم إرسال طلبك للتدقيق!'); document.getElementById('sellerModal').style.display='none';">إرسال الطلب</button>
            <button class="btn-action" style="background:#444;" onclick="document.getElementById('sellerModal').style.display='none'">إغلاق</button>
        </div>
    </div>

    <!-- قسم طلب الشراء -->
    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" placeholder="نوع السيارة المطلوبة">
        <button class="btn-action">ادفع 10 Pi للاستفسار</button>
    </div>

    <!-- الروابط القانونية -->
    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p style="color: #666; font-size: 14px;">© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
