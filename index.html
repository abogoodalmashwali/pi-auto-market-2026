<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        
        .header { padding: 40px 20px; background: #000; border-bottom: 4px solid var(--gold); }
        .logo { width: 100%; max-width: 500px; margin-bottom: 25px; }
        
        /* تنسيق عرض الصور بجانب بعض */
        .gallery-container { display: flex; justify-content: center; gap: 10px; padding: 20px; }
        .car-card { background: rgba(30, 30, 30, 0.6); padding: 10px; border-radius: 15px; width: 45%; border: 1px solid var(--gold); }
        .car-image { width: 100%; height: auto; border-radius: 10px; }

        .form-section { background: rgba(26, 26, 26, 0.7); padding: 30px; margin: 20px auto; width: 90%; border-radius: 20px; border: 1px solid var(--gold); }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--gold); background: #1a1a1a; color: #ffffff; }
        
        .btn-action { background: var(--gold); color: black; padding: 15px 30px; font-weight: bold; border-radius: 50px; border: none; margin: 5px; }
        
        /* تفعيل روابط السياسة ومتابعة الطلب */
        .footer { padding: 30px; border-top: 2px solid #333; }
        .footer a { color: var(--gold); font-size: 18px; display: block; margin: 15px 0; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المشروع">
        <h1>منصة الوسيط الآمن</h1>
    </div>

    <!-- الصور كما طلبت بجانب بعضها -->
    <div class="gallery-container">
        <div class="car-card">
            <img src="lexus_image.jpg" class="car-image" alt="لكزس">
            <h3>لكزس LX 2026</h3>
        </div>
        <div class="car-card">
            <img src="camry_image.jpg" class="car-image" alt="كامري">
            <h3>تويوتا كامري 2026</h3>
        </div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" placeholder="نوع السيارة المطلوبة">
        <input type="text" placeholder="الموديل (مثلاً 2026)">
        <input type="text" placeholder="اللون المفضل">
        <input type="text" placeholder="المواصفات المطلوبة">
        <br>
        <button class="btn-action">ادفع 10 Pi للاستفسار</button>
        <button class="btn-action" style="background: #fff;">تقديم الطلب</button>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
