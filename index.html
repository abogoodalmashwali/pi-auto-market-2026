<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Auto Market 2026</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        :root { --gold: #c5a059; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; border-radius: 20px; border: 1px solid var(--gold); }
        .btn-action { background: var(--gold); color: black; padding: 12px 25px; border-radius: 25px; border: none; margin: 10px; cursor: pointer; font-weight: bold; width: 90%; }
        .btn-test-payment { background: #e0b034 !important; }
        .gallery-container { display: flex; justify-content: center; gap: 15px; padding: 20px; flex-wrap: wrap; }
        .car-box { background: #1a1a1a; padding: 15px; border-radius: 15px; width: 45%; border: 1px solid #333; }
        .car-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        .footer a { color: var(--gold); display: block; margin: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <!-- قسم الدفع -->
    <div class="form-section">
        <button class="btn-action btn-test-payment" onclick="runPiTestPayment()">إرسال 1 Test-Pi وتأكيد التطبيق</button>
        <p id="statusMessage" style="color: #e0b034;"></p>
    </div>

    <!-- معرض السيارات -->
    <div class="gallery-container">
        <div class="car-box"><img src="toyota-camry.png" alt="كامري"><h3>تويوتا كامري 2026</h3></div>
        <div class="car-box"><img src="lexus-lx.png" alt="لكزس"><h3>لكزس LX 2026</h3></div>
    </div>

    <!-- هل تمتلك سيارة للبيع -->
    <div class="form-section">
        <h3>هل تملك سيارة وتريد عرضها للبيع؟</h3>
        <button class="btn-action" style="background:transparent; color:var(--gold); border:1px solid var(--gold);" onclick="alert('قسم عرض السيارة مفعل')">عرض سيارتي للبيع</button>
    </div>

    <!-- هل تريد شراء سيارة -->
    <div class="form-section">
        <h2>تقديم طلب شراء / استفسار 📝</h2>
        <form action="https://formspree.io" method="POST">
            <input type="text" name="الاسم" placeholder="الاسم الكامل" required style="width:90%; padding:10px; margin:5px; border-radius:8px;">
            <input type="text" name="النوع" placeholder="نوع السيارة المطلوبة" required style="width:90%; padding:10px; margin:5px; border-radius:8px;">
            <button type="submit" class="btn-action">إرسال البيانات للوسيط</button>
        </form>
    </div>

    <!-- تذييل الصفحة -->
    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p style="color: #666; font-size: 14px;">© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

    <script>
        const API_URL = 'https://pi-auto-market-2026.vercel.app/api/approve';
        
        // [كود الـ SDK والوظائف (نفس الكود السابق بالضبط)]
        window.Pi.init({ version: "2.0", sandbox: true });
        
        function updateStatus(text) { document.getElementById('statusMessage').innerText = text; }

        async function runPiTestPayment() {
            if (!window.Pi) { alert("افتح من داخل Pi Browser"); return; }
            window.Pi.authenticate(['username', 'payments'], function(auth) { executePaymentProcess(); }, onIncompletePaymentFound);
        }

        function executePaymentProcess() {
            window.Pi.createPayment({amount: 1, memo: "Auto Market Pi 2026"}, {
                onReadyForServerApproval: function(id) { fetch(API_URL, {method:'POST', body:JSON.stringify({paymentId:id})}); updateStatus("تمت الموافقة!"); },
                onReadyForServerCompletion: function(id, txid) { alert("نجاح: " + txid); },
                onError: function(err) { updateStatus("خطأ: " + err.message); }
            });
        }

        function onIncompletePaymentFound(payment) {
            fetch(API_URL, {method:'POST', body:JSON.stringify({paymentId:payment.identifier})}).then(() => window.location.reload());
        }
    </script>
</body>
</html>
