<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        .header { padding: 30px 20px; border-bottom: 2px solid var(--gold); }
        .logo { width: 100%; max-width: 400px; margin-bottom: 15px; }
        
        /* تنسيق عرض السيارات بجانب بعضها */
        .gallery-container { display: flex; justify-content: center; gap: 10px; padding: 10px; }
        .car-card { background: #1a1a1a; padding: 10px; border-radius: 15px; width: 45%; border: 1px solid var(--gold); }
        .car-image { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; }
        
        .form-section { background: #1a1a1a; padding: 25px; margin: 20px auto; width: 90%; border-radius: 20px; border: 1px solid var(--gold); }
        input { width: 85%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--gold); background: #000; color: #fff; }
        .btn-action { background: var(--gold); color: black; padding: 12px 20px; font-weight: bold; border-radius: 25px; border: none; margin: 5px; cursor: pointer; }
        
        .footer { padding: 20px; }
        .footer a { color: var(--gold); display: block; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.imgur.com/your_logo_link.png" class="logo" alt="شعار">
        <h1>منصة الوسيط الآمن</h1>
    </div>

    <!-- الصور تظهر الآن بجانب بعضها -->
    <div class="gallery-container">
        <div class="car-card">
            <img src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=300" class="car-image">
            <p>لكزس LX 2026</p>
        </div>
        <div class="car-card">
            <img src="https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=300" class="car-image">
            <p>تويوتا كامري 2026</p>
        </div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" placeholder="نوع السيارة المطلوبة">
        <input type="text" placeholder="الموديل (مثلاً 2026)">
        <input type="text" placeholder="اللون المفضل">
        <input type="text" placeholder="المواصفات المطلوبة">
        <br>
        <button class="btn-action">ادفع 10 Pi للاستفسار</button>
        <button class="btn-action" style="background: #fff;">تقديم الطلب</button>
    </div>

    <div class="footer">
        <a href="track.html">متابعة حالة طلبي</a>
        <a href="policy.html">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
