<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Pi Auto Market 2026 | المنصة الفاخرة</title>
    <style>
        :root { --gold: #c5a059; --dark: #121212; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; text-align: center; }
        
        .header { padding: 50px 20px; background: #000; border-bottom: 4px solid var(--gold); }
        .logo { width: 200px; height: 200px; border-radius: 50%; border: 3px solid var(--gold); margin-bottom: 20px; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; padding: 40px; }
        .car-card { background: #1e1e1e; padding: 20px; border-radius: 20px; transition: transform 0.3s ease; border: 1px solid #333; }
        .car-card:hover { transform: scale(1.05); border-color: var(--gold); }
        .car-image { width: 100%; height: 250px; object-fit: cover; border-radius: 15px; }

        .form-section { background: #1a1a1a; padding: 40px; margin: 40px auto; width: 80%; border-radius: 20px; border: 1px solid var(--gold); }
        input, select { width: 90%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #333; color: white; }
        
        .btn-submit { background: var(--gold); color: black; padding: 15px 50px; font-weight: bold; border-radius: 50px; border: none; cursor: pointer; font-size: 18px; margin-top: 20px; }
        
        .footer { padding: 30px; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" class="logo" alt="شعار المنصة">
        <h1>منصة الوسيط الآمن</h1>
        <p>أول منصة يمنية للتعاملات السيارات عبر عملة Pi</p>
    </div>

    <div class="gallery">
        <div class="car-card"><h3>هيونداي النترا 2026</h3><img src="hyundai-elantra.png" class="car-image"></div>
        <div class="car-card"><h3>لكزس LX 2026</h3><img src="lexus-lx.png" class="car-image"></div>
        <div class="car-card"><h3>تويوتا كامري 2026</h3><img src="toyota-camry.png" class="car-image"></div>
        <div class="car-card"><h3>تويوتا هايلوكس 2026</h3><img src="toyota-hilux.png" class="car-image"></div>
    </div>

    <div class="form-section">
        <h2>تقديم طلب شراء/استفسار</h2>
        <input type="text" placeholder="اسم مقدم الطلب الكامل">
        <input type="text" placeholder="نوع السيارة المطلوبة">
        <input type="text" placeholder="الموديل (مثلاً 2026)">
        <input type="text" placeholder="اللون المفضل">
        <input type="text" placeholder="المواصفات المطلوبة">
        <br>
        <button class="btn-submit" onclick="alert('تم إرسال طلبك بنجاح للمشرف أبو جود المشولي')">تقديم الطلب</button>
    </div>

    <div class="footer">
        <a href="policy.html" style="color: var(--gold);">سياسة الخصوصية وإخلاء المسؤولية</a>
        <p>© 2026 جميع الحقوق محفوظة لمنصة الوسيط الآمن</p>
    </div>

</body>
</html>
